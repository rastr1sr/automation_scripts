---
# Keep AXP.OS A15 scripts working against the current lineage-22.2 tip.
# 1. LineageOS e006566 (2026-07-10) made WebView use ComputerEngine.isDebuggable(), which the
#    microG signature spoofing revert removes -> revert e006566 first
# 2. shallow syncs (--depth=1) lack the commits the AXP scripts revert/cherry-pick by hash:
#    discover every "git ... <sha>" inside an enter/enterAndClear "<dir>" block, fetch + pin them

- name: "A15 drift: revert LineageOS e006566 before the microG reverts"
  ansible.builtin.lineinfile:
    path: "{{ DOSPATH }}/Scripts/LineageOS-22.2/Patch.sh"
    insertbefore: 'git revert --no-edit c60ecdffedf5ec9e05bd92dc022cbb763f49a104'
    line: 'git revert --no-edit e006566046a0a9d96bb23777f75756db9ff01410; #AXP fork: webview isDebuggable() depends on the microG spoofing code reverted below'

- name: "A15 drift: fetch + pin commits referenced by hash in AXP scripts"
  ansible.builtin.shell: |
      set -e
      python3 - "{{ DOSPATH }}" > /tmp/axp_hashes.txt <<'PY'
      import re, glob, sys
      root = sys.argv[1]
      out = set()
      for f in glob.glob(root + '/Scripts/LineageOS-22.2/*.sh') + glob.glob(root + '/Scripts/Common/*.sh'):
          d = None
          for line in open(f, errors='ignore'):
              m = re.search(r'\benter(?:AndClear)? "([^"]+)"', line)
              if m: d = m.group(1)
              code = line.split('#', 1)[0]
              if d and re.search(r'\bgit\b', code):
                  for h in re.findall(r'\b[0-9a-f]{40}\b', code): out.add((d, h))
      for d, h in sorted(out): print(d, h)
      PY
      while read d h; do
        [ -d "$d" ] || continue
        r=$(git -C "$d" remote | head -1)
        git -C "$d" cat-file -e "$h^{commit}" 2>/dev/null || git -C "$d" fetch -q --depth=2 "$r" "$h"
        git -C "$d" update-ref "refs/axp-keep/$h" "$h"
        echo "pinned $d $h"
      done < /tmp/axp_hashes.txt
  args:
    executable: /bin/bash
    chdir: "{{ SRCPATH }}"
